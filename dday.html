<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D-Day 계산기 - 인터넷활용 실습</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dday-page { max-width: 680px; margin: 0 auto; padding: 32px 20px; }
        .dday-nav { display: flex; flex-wrap: wrap; gap: 20px; margin: 24px 0; }
        .dday-nav a { text-decoration: underline; }
        .dday-result { background: #ece2ce; color: #302c25; padding: 24px; border-radius: 8px; }
        .dday-page footer { margin-top: 24px; }
    </style>
</head>
<body class="dday-page">
<header>
    <h1>고태준</h1>
    <p class="subtitle">배우고, 만들고, 기록하는 중.</p>
</header>

<nav class="dday-nav" aria-label="포트폴리오 메뉴">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
</nav>

<main class="container">
    <section class="dday-result">
        <h2>Date 객체 활용: D-Day 계산기</h2>
        <script>
            // 오늘 날짜를 구하고 목표 날짜의 연, 월, 일을 입력받습니다.
            const now = new Date();
            const yearStr = prompt("목표 연도를 입력하세요 (예: 2026)", String(now.getFullYear()));
            const monthStr = yearStr?.trim() ? prompt("목표 월을 입력하세요 (1~12)", "12") : null;
            const dayStr = monthStr?.trim() ? prompt("목표 일을 입력하세요 (1~31)", "25") : null;

            if (!yearStr?.trim() || !monthStr?.trim() || !dayStr?.trim()) {
                document.write("<h3>계산 취소.</h3>");
            } else {
                const year = parseInt(yearStr, 10);
                const month = parseInt(monthStr, 10);
                const day = parseInt(dayStr, 10);

                // Date 객체의 월은 0부터 시작합니다.
                const targetDate = new Date(year, month - 1, day);
                const isValidDate = /^\d{4}$/.test(yearStr.trim())
                    && /^\d{1,2}$/.test(monthStr.trim())
                    && /^\d{1,2}$/.test(dayStr.trim())
                    && targetDate.getFullYear() === year
                    && targetDate.getMonth() === month - 1
                    && targetDate.getDate() === day;

                if (!isValidDate) {
                    document.write("<h3>올바른 날짜를 입력하세요.</h3>");
                } else {
                    const today = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
                    const target = new Date(Date.UTC(year, month - 1, day));
                    const diffMs = target.getTime() - today.getTime();
                    const diffDay = Math.ceil(diffMs / (1000 * 60 * 60 * 24));

                    document.write("<p>목표 날짜: " + targetDate.toLocaleDateString("ko-KR") + "</p>");
                    if (diffDay === 0) {
                        document.write("<h3>D-Day 입니다!</h3>");
                    } else if (diffDay > 0) {
                        document.write("<h3>D-" + diffDay + " (" + diffDay + "일 남았습니다.)</h3>");
                    } else {
                        const elapsedDays = Math.abs(diffDay);
                        document.write("<h3>D+" + elapsedDays + " (" + elapsedDays + "일 지났습니다.)</h3>");
                    }
                    document.write("<p>오늘 날짜: " + now.toLocaleDateString("ko-KR") + "</p>");
                }
            }

            document.write("<p>새로고침(F5)을 눌러 다시 계산할 수 있습니다.</p>");
        </script>
    </section>
</main>
