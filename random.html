<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내맘대로 랜덤 뽑기 - 인터넷활용 실습</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .random-page { max-width: 680px; margin: 0 auto; padding: 32px 20px; }
        .random-nav { display: flex; flex-wrap: wrap; gap: 20px; margin: 24px 0; }
        .random-nav a { text-decoration: underline; }
        .random-result {
            background: #ece2ce;
            color: #302c25;
            padding: 24px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }
        .random-choice { font-size: 2rem; font-weight: bold; color: #79392d; }
        .random-page footer { margin-top: 24px; }
    </style>
</head>
<body class="random-page">
<header>
    <h1>고태준</h1>
    <p class="subtitle">배우고, 만들고, 기록하는 중.</p>
</header>

<nav class="random-nav" aria-label="포트폴리오 메뉴">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="portfolio.html">Portfolio</a>
    <a href="contact.html">Contact</a>
</nav>

<main class="container">
    <section class="random-result">
        <h2>String + Array + Math 조합: 내맘대로 뽑기</h2>
        <script>
            // 쉼표로 구분한 항목을 한 번 입력받습니다.
            const defaultList = "제육볶음,돈까스,순대국,김치찌개,햄버거,초밥,파스타,샐러드,떡볶이,마라탕,사과,바나나,딸기,수박";
            const inputString = prompt("항목을 쉼표(,)로 구분하여 입력하세요.", defaultList);

            if (!inputString || !inputString.trim()) {
                document.write("<h3>뽑기를 취소했습니다.</h3>");
            } else {
                // 문자열을 배열로 나누고 양쪽 공백과 빈 항목을 제거합니다.
                const items = inputString.split(",")
                    .map((item) => item.trim())
                    .filter((item) => item !== "");

                if (items.length === 0) {
                    document.write("<h3>항목을 한 개 이상 입력하세요.</h3>");
                } else {
                    const index = Math.floor(Math.random() * items.length);
                    const choice = items[index];

                    // 입력한 글자가 HTML 태그로 해석되지 않도록 변환합니다.
                    function escapeHtml(text) {
                        return text.replaceAll("&", "&amp;")
                            .replaceAll("<", "&lt;")
                            .replaceAll(">", "&gt;");
                    }

                    document.write("<h3>입력한 항목 (총 " + items.length + "개)</h3>");
                    document.write("<p>" + escapeHtml(items.join(", ")) + "</p>");
                    document.write("<hr>");
                    document.write("<h3>당신의 선택은...</h3>");
                    document.write('<p class="random-choice">' + escapeHtml(choice) + "!</p>");
                }
            }

            document.write("<p>새로고침(F5)을 눌러 다시 뽑을 수 있습니다.</p>");
        </script>
    </section>
</main>

<footer>
    <small>&copy; 고태준</small>
</footer>
</body>
</html>
